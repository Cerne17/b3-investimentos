name: Coleta de dados

# Atualiza data/b3.db e faz commit; o push na main dispara o deploy da Vercel.
# Dias úteis à noite: só renda fixa (Banco Central + Tesouro Direto), que é rápida.
# Sábado de manhã: coleta completa (CSVs da B3, CVM, Yahoo para ações/ETFs/FIIs, criptos e renda fixa).
on:
  schedule:
    - cron: "30 23 * * 1-5"   # 20h30 em Brasília
    - cron: "0 9 * * 6"       # sábado, 6h em Brasília
  workflow_dispatch:
    inputs:
      modo:
        description: "rendafixa, cripto ou completa"
        default: rendafixa

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Coletar
        working-directory: backend
        env:
          MODO: ${{ github.event.inputs.modo || (github.event.schedule == '0 9 * * 6' && 'completa') || 'rendafixa' }}
        run: |
          echo "modo: $MODO"
          if [ "$MODO" = "completa" ]; then
            python -m app.ingest
          else
            python -m app.ingest --only "$MODO"
          fi
      - name: Compactar e publicar
        run: |
          sqlite3 data/b3.db "VACUUM;"
          if git diff --quiet -- data/b3.db; then echo "sem mudanças"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/b3.db
          git commit -m "Dados: coleta ${MODO:-automática} de $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
        env:
          MODO: ${{ github.event.inputs.modo || (github.event.schedule == '0 9 * * 6' && 'completa') || 'rendafixa' }}
